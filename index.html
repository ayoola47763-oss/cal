<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simple Calculator</title>
<style>
  body { font-family: Arial; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f0f0f0; margin: 0; }
  .calc { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 280px; }
  #display { width: 100%; height: 50px; font-size: 24px; text-align: right; border: 1px solid #ddd; border-radius: 8px; padding: 10px; box-sizing: border-box; margin-bottom: 15px; }
  .buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  button { height: 55px; font-size: 20px; border: none; border-radius: 8px; cursor: pointer; background: #eee; }
  button:hover { background: #ddd; }
  .equal { background: #000; color: white; }
  .equal:hover { background: #333; }
  .clear { background: #ff3b30; color: white; }
</style>
</head>
<body>

<div class="calc">
  <input type="text" id="display" disabled>
  <div class="buttons">
    <button class="clear" onclick="clearDisplay()">C</button>
    <button onclick="appendValue('/')">/</button>
    <button onclick="appendValue('*')">×</button>
    <button onclick="deleteLast()">⌫</button>
    
    <button onclick="appendValue('7')">7</button>
    <button onclick="appendValue('8')">8</button>
    <button onclick="appendValue('9')">9</button>
    <button onclick="appendValue('-')">-</button>
    
    <button onclick="appendValue('4')">4</button>
    <button onclick="appendValue('5')">5</button>
    <button onclick="appendValue('6')">6</button>
    <button onclick="appendValue('+')">+</button>
    
    <button onclick="appendValue('1')">1</button>
    <button onclick="appendValue('2')">2</button>
    <button onclick="appendValue('3')">3</button>
    <button class="equal" onclick="calculate()" style="grid-row: span 2; height: auto;">=</button>
    
    <button onclick="appendValue('0')" style="grid-column: span 2;">0</button>
    <button onclick="appendValue('.')">.</button>
  </div>
</div>

<script>
  let display = document.getElementById('display');
  function appendValue(val) { display.value += val; }
  function clearDisplay() { display.value = ''; }
  function deleteLast() { display.value = display.value.slice(0, -1); }
  function calculate() {
    try { display.value = eval(display.value); }
    catch { display.value = 'Error'; }
  }
</script>

</body>
</html>
